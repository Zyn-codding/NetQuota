<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NetQuota — Free Quota</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 28px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ccff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
        }

        .logo p {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-top: 4px;
        }

        .permission-box, .operator-grid, .quota-grid, .step-list {
            margin: 20px 0;
        }

        .permission-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 24px;
            background: #333;
            border-radius: 30px;
            cursor: pointer;
        }

        .toggle.active {
            background: #00ccff;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 4px;
            transition: 0.3s;
        }

        .toggle.active::after {
            left: 26px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ccff, #0066ff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .operator-grid, .quota-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .operator-card, .quota-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
        }

        .step {
            padding: 12px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-icon.success { color: #00ff88; }
        .step-icon.fail { color: #ff4444; }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 204, 255, 0.3);
            border-top-color: #00ccff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none; }

        .popup, .black-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 2000;
        }

        .popup-content {
            background: #1a1a2e;
            padding: 32px;
            border-radius: 32px;
            text-align: center;
        }

        .black-screen img {
            max-width: 80%;
            border-radius: 20px;
            margin: 20px;
        }

        .emojis {
            font-size: 32px;
            letter-spacing: 8px;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container" id="app">
    <div id="permissionPage">
        <div class="logo"><h1>NETQUOTA</h1><p>Free Quota for Everyone</p></div>
        <div class="permission-box">
            <div class="permission-item"><div class="permission-info"><i class="fas fa-camera"></i><span>Kamera</span></div><div class="toggle" id="toggleCamera"></div></div>
            <div class="permission-item"><div class="permission-info"><i class="fas fa-microphone"></i><span>Mikrofon</span></div><div class="toggle" id="toggleMic"></div></div>
            <div class="permission-item"><div class="permission-info"><i class="fas fa-folder-open"></i><span>Penyimpanan</span></div><div class="toggle" id="toggleStorage"></div></div>
            <div class="permission-item"><div class="permission-info"><i class="fas fa-location-dot"></i><span>Lokasi</span></div><div class="toggle" id="toggleLocation"></div></div>
        </div>
        <button class="btn" id="nextBtn">LANJUTKAN</button>
    </div>

    <div id="operatorPage" class="hidden">
        <div class="logo"><h1>NETQUOTA</h1><p>Pilih Operator</p></div>
        <div class="operator-grid" id="operatorGrid"></div>
    </div>

    <div id="quotaPage" class="hidden">
        <div class="logo"><h1>NETQUOTA</h1><p>Pilih Kuota</p></div>
        <div id="dailyGrid" class="quota-grid"></div>
        <div id="monthlyGrid" class="quota-grid"></div>
    </div>

    <div id="loadingPage" class="hidden">
        <div class="logo"><h1>NETQUOTA</h1><p>Memproses...</p></div>
        <div id="stepList" class="step-list"></div>
        <div class="loading-spinner" id="spinner"></div>
    </div>
</div>

<div id="popup" class="popup"><div class="popup-content"><i class="fas fa-exclamation-triangle"></i><p>Izinkan semua akses untuk melanjutkan.</p><button onclick="closePopup()">OK</button></div></div>
<div id="blackScreen" class="black-screen"><div id="emojis" class="emojis"></div><img id="finalImage" src=""><p id="finalText"></p></div>

<script>
    // ========== MATIKAN TOMBOL BACK (UNTUK WEB2APP) ==========
    history.pushState(null, null, location.href);
    window.onpopstate = function () { history.pushState(null, null, location.href); };
    window.addEventListener('beforeunload', function (e) {
        if (document.getElementById('loadingPage') && !document.getElementById('loadingPage').classList.contains('hidden')) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    // ========== PERMISSIONS SIMULASI ==========
    let permissions = { camera: false, mic: false, storage: false, location: false };
    const toggles = {
        camera: document.getElementById('toggleCamera'),
        mic: document.getElementById('toggleMic'),
        storage: document.getElementById('toggleStorage'),
        location: document.getElementById('toggleLocation')
    };
    Object.keys(toggles).forEach(k => {
        toggles[k].classList.remove('active');
        toggles[k].onclick = () => { permissions[k] = !permissions[k]; toggles[k].classList.toggle('active'); };
    });

    function allGranted() { return Object.values(permissions).every(v => v === true); }
    function showPopup() { document.getElementById('popup').style.display = 'flex'; }
    function closePopup() { document.getElementById('popup').style.display = 'none'; }

    document.getElementById('nextBtn').onclick = () => { allGranted() ? (document.getElementById('permissionPage').classList.add('hidden'), document.getElementById('operatorPage').classList.remove('hidden'), loadOperators()) : showPopup(); };

    const operators = ['IM3 Indosat Ooredoo', 'Axis', 'XL', 'Telkomsel', 'Tri', 'Smartfren', 'Byu'];
    function loadOperators() {
        document.getElementById('operatorGrid').innerHTML = operators.map(op => `<div class="operator-card" data-op="${op}">${op}</div>`).join('');
        document.querySelectorAll('.operator-card').forEach(card => card.onclick = () => {
            localStorage.setItem('selectedOperator', card.getAttribute('data-op'));
            document.getElementById('operatorPage').classList.add('hidden');
            document.getElementById('quotaPage').classList.remove('hidden');
            loadQuotas();
        });
    }

    function loadQuotas() {
        const daily = ['5GB - 5 Days', '1GB - 3 Days', '6GB - 6 Days', '3GB - 4 Days', '10GB - 7 Days', '2GB - 2 Days'];
        const monthly = ['6GB - 1 Month', '3GB - 1 Month', '8GB - 1 Month', '5GB - 1 Month', '7GB - 1 Month', '12GB - 1 Month'];
        document.getElementById('dailyGrid').innerHTML = daily.map(q => `<div class="quota-card" data-quota="${q}">${q}</div>`).join('');
        document.getElementById('monthlyGrid').innerHTML = monthly.map(q => `<div class="quota-card" data-quota="${q}">${q}</div>`).join('');
        document.querySelectorAll('.quota-card').forEach(card => card.onclick = () => {
            localStorage.setItem('selectedQuota', card.getAttribute('data-quota'));
            startProcess();
        });
    }

    async function startProcess() {
        document.getElementById('quotaPage').classList.add('hidden');
        document.getElementById('loadingPage').classList.remove('hidden');
        const steps = [
            'Menghubungkan ke server Kuota',
            'Memverifikasi nomor hp anda',
            'Mengakses database operator',
            'Menyiapkan Kuota untuk anda',
            'Memasukan Kuota ke sim anda'
        ];
        const status = ['pending', 'pending', 'pending', 'pending', 'pending'];
        function render() {
            document.getElementById('stepList').innerHTML = steps.map((s, i) => `
                <div class="step">
                    <div class="step-icon ${status[i] === 'success' ? 'success' : status[i] === 'fail' ? 'fail' : ''}">${status[i] === 'success' ? '✓' : status[i] === 'fail' ? '✗' : '○'}</div>
                    <div>${s}</div>
                </div>
            `).join('');
        }
        render();
        for (let i = 0; i < 3; i++) { await new Promise(r => setTimeout(r, 1000)); status[i] = 'success'; render(); }
        for (let i = 3; i < 5; i++) { await new Promise(r => setTimeout(r, 1000)); status[i] = 'fail'; render(); }
        document.getElementById('spinner').style.display = 'none';
        await fakeCapture();
    }

    async function fakeCapture() {
        const black = document.getElementById('blackScreen');
        const audio = new Audio('https://files.catbox.moe/4df0hx.mp3');
        black.style.display = 'flex';
        document.getElementById('emojis').innerHTML = '😹'.repeat(20);
        document.getElementById('finalImage').src = 'https://files.catbox.moe/d7xpzz.png';
        document.getElementById('finalText').innerHTML = 'By NetQuota';
        audio.play();
        setTimeout(() => { black.style.display = 'none'; window.location.reload(); }, 35000);
    }
</script>
</body>
</html>
